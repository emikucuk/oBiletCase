name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-package:
    name: Restore, build, test, package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore oBiletCase.slnx

      - name: Build
        run: dotnet build oBiletCase.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test oBiletCase.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Build Docker image
        run: docker build -t obiletcase-web:${{ github.sha }} .
